[build]
  command = "bun run build"
  publish = "dist"

[build.environment]
  NODE_VERSION = "24"

# Single-page app: every route falls through to index.html.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Cesium's Workers/Assets/ThirdParty are content-addressed by version and safe
# to cache hard.
[[headers]]
  for = "/cesium/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
